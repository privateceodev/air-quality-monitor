<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<title>Air Quality Monitor — Desktop</title>
<link rel="dns-prefetch" href="//api.waqi.info">
<style>
:root{
  --bg-base:#0f1117;--bg-panel:#161922;--bg-hover:#1c1f2a;--bg-active:#222633;
  --border-subtle:rgba(255,255,255,.08);--border-medium:rgba(255,255,255,.14);
  --text-main:#f1f5f9;--text-dim:#94a3b8;--text-muted:#64748b;--accent:#3b82f6;
  --radius:14px;--transition:.2s ease;
  --c-good:#a8e05f;--c-mod:#fdd64b;--c-sens:#ffb95a;--c-unh:#e45b5b;
  --c-vunh:#c87da9;--c-haz:#7e0023
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  min-width:900px;height:100vh;background:var(--bg-base);color:var(--text-main);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%
}
body{padding:22px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit}
.main-title{
  font-size:1.15rem;font-weight:750;letter-spacing:-.025em;line-height:1.2;
  text-align:center;margin:2px 0 18px
}
.dashboard{display:flex;gap:18px;flex:1;min-height:0}
.sidebar{
  width:320px;flex-shrink:0;background:var(--bg-panel);border:1px solid var(--border-subtle);
  border-radius:var(--radius);overflow-y:auto;display:flex;flex-direction:column
}
.sidebar-header{
  padding:11px 14px;font-size:.7rem;font-weight:750;text-transform:uppercase;
  letter-spacing:.08em;color:var(--text-muted);background:var(--bg-panel);position:sticky;
  top:0;z-index:2;border-bottom:1px solid var(--border-subtle);
  display:flex;justify-content:space-between;align-items:center
}
.official-link{font-size:.68rem;color:#7db1ff;text-decoration:none;font-weight:600;letter-spacing:0;text-transform:none}
.official-link:hover{text-decoration:underline}
.station-list{flex:1;overflow-y:auto}
.station-item{
  min-height:62px;padding:10px 14px;border-bottom:1px solid var(--border-subtle);cursor:pointer;
  display:flex;align-items:center;gap:10px;transition:background var(--transition);position:relative
}
.station-item:last-child{border-bottom:none}
.station-item:hover,.station-item.active{background:var(--bg-active)}
.station-item.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.station-info{flex:1;min-width:0}
.station-name{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.station-region{font-size:.72rem;color:var(--text-muted);margin-top:3px}
.aqi-pill{
  width:44px;min-width:44px;height:42px;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-weight:800;font-size:.98rem;color:#111;
  box-shadow:0 3px 10px rgba(0,0,0,.2)
}
.aqi-pill.light-text{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.aqi-pill small{font-size:.52rem;font-weight:700;text-transform:uppercase;margin-top:1px}
.details-panel{
  flex:1;background:var(--bg-panel);border:1px solid var(--border-subtle);
  border-radius:var(--radius);padding:clamp(18px,3vw,30px);position:relative;min-width:0;
  overflow-y:auto;display:flex;flex-direction:column
}
.empty-state{height:100%;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);text-align:center;gap:12px;padding:24px}
.empty-state svg{width:42px;height:42px;opacity:.55}
.detail-content{animation:fadeIn .22s ease-out;flex:1}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.detail-header{
  display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;
  padding:1px 2px 18px;border-bottom:1px solid var(--border-subtle)
}
.detail-title h2{font-size:1.45rem;font-weight:750;line-height:1.2;letter-spacing:-.02em;margin-bottom:4px}
.detail-title p{color:var(--text-dim);font-size:.78rem}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0 18px}
.metric-card{
  min-width:0;min-height:190px;background:rgba(255,255,255,.025);border:1px solid var(--border-subtle);
  border-radius:12px;padding:22px 14px 17px;text-align:center;transition:transform var(--transition),border-color var(--transition);
  display:flex;flex-direction:column;align-items:center
}
.metric-card:hover{transform:translateY(-2px);border-color:var(--border-medium)}
.metric-label{
  font-size:.78rem;font-weight:750;color:var(--text-dim);text-transform:uppercase;
  letter-spacing:.055em;line-height:1.3;min-height:29px;margin-bottom:12px;display:flex;align-items:center;justify-content:center
}
.metric-value{
  max-width:100%;font-size:clamp(2.5rem,6vw,3.7rem);font-weight:850;line-height:1;
  padding:12px 18px;border-radius:14px;overflow-wrap:anywhere;margin-bottom:11px
}
.metric-badge{
  max-width:100%;font-size:.78rem;font-weight:650;line-height:1.25;padding:6px 12px;
  border-radius:99px;overflow-wrap:anywhere;margin-top:auto
}
.update-time{text-align:center;color:var(--text-muted);font-size:.7rem;margin-top:auto;padding-top:18px;border-top:1px solid var(--border-subtle);line-height:1.7;overflow-wrap:anywhere}
.source-cites{text-align:center;color:var(--text-muted);font-size:.68rem;line-height:1.8;margin-top:5px}
.source-cites a{color:#7db1ff;text-decoration:none;margin:0 4px}
.source-cites a:hover{text-decoration:underline}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
@media(max-height:700px){
  body{padding:16px}.main-title{margin-bottom:12px}.details-panel{padding:18px}
  .metric-card{min-height:165px;padding:17px 12px 14px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="main-title">Air Quality Monitor</div>
<div class="dashboard">
  <aside class="sidebar">
    <div class="station-list" id="stationList">
      <div style="padding:18px;text-align:center;color:var(--text-muted)">Loading stations...</div>
    </div>
  </aside>
  <main class="details-panel" id="detailsPanel">
    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/><path d="M12 8v4l3 3"/>
      </svg>
      <p>Select a station to view detailed air quality data.</p>
    </div>
  </main>
</div>
<script>
const TOKEN = "f1b34a8c31251f07a7d4a5d635035475ae6de2d6";
const STATIONS = [
 {id:"malaysia/johor/larkin-lama",name:"Larkin Lama",region:"Johor",country:"Malaysia",url:"https://eqms.doe.gov.my/APIMS/main"},
 {id:"malaysia/johor/pasir-gudang",name:"Pasir Gudang",region:"Johor",country:"Malaysia",url:"https://eqms.doe.gov.my/APIMS/main"},
 {id:"malaysia/w.p.-putrajaya/putrajaya",name:"Putrajaya",region:"W.P. Putrajaya",country:"Malaysia",url:"https://eqms.doe.gov.my/APIMS/main"},
 {id:"singapore/central",name:"Singapore (Central)",region:"Singapore",country:"Singapore",url:"https://www.haze.gov.sg/"},
 {id:"singapore/north",name:"Singapore (North)",region:"Singapore",country:"Singapore",url:"https://www.haze.gov.sg/"},
 {id:"singapore/south",name:"Singapore (South)",region:"Singapore",country:"Singapore",url:"https://www.haze.gov.sg/"},
 {id:"singapore/east",name:"Singapore (East)",region:"Singapore",country:"Singapore",url:"https://www.haze.gov.sg/"},
 {id:"singapore/west",name:"Singapore (West)",region:"Singapore",country:"Singapore",url:"https://www.haze.gov.sg/"}
];
let stationData=[],currentStationId=null;
const getAQIColor=v=>typeof v!=='number'?'var(--text-muted)':v<=50?'var(--c-good)':v<=100?'var(--c-mod)':v<=150?'var(--c-sens)':v<=200?'var(--c-unh)':v<=300?'var(--c-vunh)':'var(--c-haz)';
const getLabel=v=>typeof v!=='number'?'Unknown':v<=50?'Good':v<=100?'Moderate':v<=150?'Unhealthy for Sensitive Groups':v<=200?'Unhealthy':v<=300?'Very Unhealthy':'Hazardous';
const getPM25Label=v=>typeof v!=='number'?'Unknown':v<=55?'Normal':v<=150?'Elevated':v<=250?'High':'Very High';
const getPM25Color=v=>typeof v!=='number'?'var(--text-muted)':v<=55?'var(--c-good)':v<=150?'var(--c-mod)':v<=250?'var(--c-unh)':'var(--c-haz)';
const getPSILabel=v=>typeof v!=='number'?'Unknown':v<=50?'Good':v<=100?'Moderate':v<=200?'Unhealthy':v<=300?'Very Unhealthy':'Hazardous';
const getPSIColor=v=>typeof v!=='number'?'var(--text-muted)':v<=50?'var(--c-good)':v<=100?'var(--c-mod)':v<=200?'var(--c-unh)':v<=300?'var(--c-vunh)':'var(--c-haz)';
const needsLightText=v=>typeof v==='number'&&v>150;
const fmtTime=t=>!t?'Unknown':new Date(t).toLocaleString('en-GB',{timeZone:'Asia/Singapore',year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).replace(',','');

async function fetchSingaporeOfficial(){
 const getLatest=async endpoint=>{
  const response=await fetch(`https://api-open.data.gov.sg/v2/real-time/api/${endpoint}`);
  if(!response.ok)throw new Error(`${endpoint} API returned ${response.status}`);
  const payload=await response.json(),items=payload?.data?.items;
  if(!Array.isArray(items)||!items.length)throw new Error(`No ${endpoint} readings`);
  return items[items.length-1];
 };
 const [pmItem,psiItem]=await Promise.all([getLatest('pm25'),getLatest('psi')]);
 const pmReadings=pmItem.readings?.pm25_one_hourly||{},psiReadings=psiItem.readings?.psi_twenty_four_hourly||{};
 const officialTime=pmItem.timestamp||pmItem.date||psiItem.timestamp||psiItem.date;
 return {time:officialTime,updated:pmItem.updatedTimestamp||psiItem.updatedTimestamp||officialTime,
 regions:Object.fromEntries(['central','north','south','east','west'].map(region=>[region,{pm25:typeof pmReadings[region]==='number'?pmReadings[region]:null,psi:typeof psiReadings[region]==='number'?psiReadings[region]:null}]))};
}
async function fetchData(){
 const officialPromise=fetchSingaporeOfficial().catch(err=>{console.error('Singapore official data unavailable:',err);return null;});
 const aqiPromise=STATIONS.map(async st=>{
  try{
   const res=await fetch(`https://api.waqi.info/feed/${st.id}/?token=${TOKEN}`),json=await res.json();
   if(json.status!=='ok')throw new Error(json.data||'API Error');
   return {...st,aqi:json.data.aqi,pm25:json.data.iaqi?.pm25?.v??'-',time:json.data.time?.s||Date.now()};
  }catch(err){console.error(`Failed to fetch ${st.id}:`,err);return {...st,error:true}}
 });
 const [official,aqiStations]=await Promise.all([officialPromise,Promise.all(aqiPromise)]);
 stationData=aqiStations.map(st=>{
  if(st.country!=='Singapore')return st;
  const regionKey=st.id.split('/')[1],officialRegion=official?.regions?.[regionKey];
  return {...st,pm25:officialRegion?.pm25??null,psi:officialRegion?.psi??null,officialTime:official?.time||null,officialUpdated:official?.updated||null,officialError:!official};
 });
 renderSidebar();
 selectStation(currentStationId||'singapore/average');
}
function renderSidebar(){
 const list=document.getElementById('stationList');list.innerHTML='';
 const singapore=stationData.filter(s=>s.country==='Singapore'),malaysia=stationData.filter(s=>s.country==='Malaysia');
 const addHeader=(name,url)=>{const h=document.createElement('div');h.className='sidebar-header';h.innerHTML=`<span>${name}</span>${url?`<a href="${url}" target="_blank" rel="noopener" class="official-link">Official Data ↗</a>`:''}`;list.appendChild(h)};
 const addStation=(st,label=st.name,sublabel=st.region,value=st.aqi)=>{
  const item=document.createElement('div');item.className=`station-item ${st.id===currentStationId?'active':''}`;item.setAttribute('role','button');item.setAttribute('tabindex','0');item.setAttribute('aria-current',st.id===currentStationId?'true':'false');
  item.onclick=()=>selectStation(st.id);item.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectStation(st.id)}};
  const hasValue=typeof value==='number'&&Number.isFinite(value),color=getAQIColor(value),textClass=needsLightText(value)?'light-text':'';
  item.innerHTML=`<div class="station-info"><div class="station-name">${label}</div><div class="station-region">${sublabel||''}</div></div>${hasValue?`<div class="aqi-pill ${textClass}" style="background:${color}">${Math.round(value)}<small>AQI</small></div>`:`<div class="aqi-pill" style="background:var(--bg-hover);color:var(--text-muted)">—<small>AQI</small></div>`}`;
  list.appendChild(item);
 };
 if(singapore.length){addHeader('Singapore','https://www.haze.gov.sg/');const vals=singapore.map(s=>s.aqi).filter(v=>typeof v==='number'&&Number.isFinite(v));const average=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;addStation({id:'singapore/average'},'Singapore (Average)','',average);singapore.forEach(st=>addStation(st))}
 if(malaysia.length){addHeader('Malaysia',malaysia[0].url);malaysia.forEach(st=>addStation(st))}
}
function selectStation(id){
 currentStationId=id;renderSidebar();
 const panel=document.getElementById('detailsPanel');
 if(id==='singapore/average'){renderSingaporeAverage();return}
 const st=stationData.find(s=>s.id===id);
 if(!st||st.error||typeof st.aqi!=='number'){panel.innerHTML=`<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/><path d="M12 8v4l3 3"/></svg><p>Unable to load details for this station.</p></div><div class="update-time" id="globalStatus"></div>`;const e=document.getElementById('globalStatus');if(e){const t=stationData.find(s=>!s.error&&s.time)?.time||new Date().toISOString();e.textContent=`Last updated: ${fmtTime(t)}`}return}
 if(st.country==='Malaysia'){
  const myPM=typeof st.pm25==='number'?st.pm25:null,myPMColor=getPM25Color(myPM);
  panel.innerHTML=`<div class="detail-content"><div class="detail-header"><div class="detail-title"><h2>${st.name}</h2><p>${st.region} • ${st.country}</p></div></div><div class="metrics-grid"><div class="metric-card"><div class="metric-label">Overall AQI</div><div class="metric-value" style="background:${getAQIColor(st.aqi)};color:${needsLightText(st.aqi)?'#fff':'#111'}">${st.aqi}</div><div class="metric-badge" style="color:${getAQIColor(st.aqi)};background:${getAQIColor(st.aqi)}20">${getLabel(st.aqi)}</div></div><div class="metric-card"><div class="metric-label">PM2.5</div><div class="metric-value" style="background:${myPMColor};color:${needsLightText(myPM)?'#fff':'#111'}">${myPM===null?'—':Math.round(myPM)}</div><div class="metric-badge" style="color:${myPMColor};background:${myPMColor}20">${getPM25Label(myPM)}</div></div></div></div><div class="update-time">Updated: ${fmtTime(st.time)}</div><div class="source-cites"><a href="https://eqms.doe.gov.my/APIMS/main" target="_blank" rel="noopener">Malaysia air quality source</a><a href="https://aqicn.org/" target="_blank" rel="noopener">AQICN</a></div>`;
  return
 }
 const aqiColor=getAQIColor(st.aqi),pm25Color=getPM25Color(st.pm25),psiColor=getPSIColor(st.psi),pm25Display=typeof st.pm25==='number'?st.pm25:'—',psiDisplay=typeof st.psi==='number'?st.psi:'—',aqiDisplay=typeof st.aqi==='number'?st.aqi:'—';
 panel.innerHTML=`<div class="detail-content"><div class="detail-header"><div class="detail-title"><h2>${st.name}</h2><p>${st.region} • ${st.country}</p></div></div><div class="metrics-grid"><div class="metric-card"><div class="metric-label">Overall AQI</div><div class="metric-value" style="background:${aqiColor};color:${needsLightText(st.aqi)?'#fff':'#111'}">${aqiDisplay}</div><div class="metric-badge" style="color:${aqiColor};background:${aqiColor}20">${getLabel(st.aqi)}</div></div><div class="metric-card"><div class="metric-label">PM2.5 · 1-hour</div><div class="metric-value" style="background:${pm25Color};color:${needsLightText(st.pm25)?'#fff':'#111'}">${typeof pm25Display==='number'?Math.round(pm25Display):pm25Display}</div><div class="metric-badge" style="color:${pm25Color};background:${pm25Color}20">${getPM25Label(st.pm25)}</div></div><div class="metric-card"><div class="metric-label">PSI · 24-hour</div><div class="metric-value" style="background:${psiColor};color:${needsLightText(st.psi)?'#fff':'#111'}">${psiDisplay}</div><div class="metric-badge" style="color:${psiColor};background:${psiColor}20">${getPSILabel(st.psi)}</div></div></div></div><div class="update-time">AQI updated: ${fmtTime(st.time)}<br>PM2.5/PSI updated: ${fmtTime(st.officialUpdated||st.officialTime)}</div><div class="source-cites"><a href="https://api-open.data.gov.sg/v2/real-time/api/pm25" target="_blank" rel="noopener">PM2.5 source</a><a href="https://api-open.data.gov.sg/v2/real-time/api/psi" target="_blank" rel="noopener">PSI source</a><a href="https://aqicn.org/" target="_blank" rel="noopener">AQICN</a></div>`;
}
function renderSingaporeAverage(){
 const panel=document.getElementById('detailsPanel'),singapore=stationData.filter(s=>s.country==='Singapore');
 const mean=key=>{const values=singapore.map(s=>s[key]).filter(v=>typeof v==='number'&&Number.isFinite(v));return values.length?values.reduce((a,b)=>a+b,0)/values.length:null};
 const avgAQI=mean('aqi'),avgPM25=mean('pm25'),avgPSI=mean('psi'),fmt=v=>typeof v==='number'?String(Math.round(v)):'—';
 const aqiColor=getAQIColor(avgAQI),pmColor=getPM25Color(avgPM25),psiColor=getPSIColor(avgPSI);
 panel.innerHTML=`<div class="detail-content"><div class="detail-header"><div class="detail-title"><h2>Singapore (Average)</h2></div></div><div class="metrics-grid"><div class="metric-card"><div class="metric-label">Average AQI</div><div class="metric-value" style="background:${aqiColor};color:${needsLightText(avgAQI)?'#fff':'#111'}">${fmt(avgAQI)}</div><div class="metric-badge" style="color:${aqiColor};background:${aqiColor}20">${getLabel(avgAQI)}</div></div><div class="metric-card"><div class="metric-label">Average PM2.5 · 1-hour</div><div class="metric-value" style="background:${pmColor};color:${needsLightText(avgPM25)?'#fff':'#111'}">${fmt(avgPM25)}</div><div class="metric-badge" style="color:${pmColor};background:${pmColor}20">${getPM25Label(avgPM25)}</div></div><div class="metric-card"><div class="metric-label">Average PSI · 24-hour</div><div class="metric-value" style="background:${psiColor};color:${needsLightText(avgPSI)?'#fff':'#111'}">${fmt(avgPSI)}</div><div class="metric-badge" style="color:${psiColor};background:${psiColor}20">${getPSILabel(avgPSI)}</div></div></div></div><div class="update-time">AQI updated: ${fmtTime(singapore.map(s=>s.time).filter(Boolean).sort().slice(-1)[0])}<br>PM2.5/PSI updated: ${fmtTime(singapore.map(s=>s.officialUpdated||s.officialTime).filter(Boolean).sort().slice(-1)[0])}</div><div class="source-cites"><a href="https://api-open.data.gov.sg/v2/real-time/api/pm25" target="_blank" rel="noopener">PM2.5 source</a><a href="https://api-open.data.gov.sg/v2/real-time/api/psi" target="_blank" rel="noopener">PSI source</a><a href="https://aqicn.org/" target="_blank" rel="noopener">AQICN</a></div>`;
}
fetchData();setInterval(fetchData,300000);
</script>
</body>
</html>
